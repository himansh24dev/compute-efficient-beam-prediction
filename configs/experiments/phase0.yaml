# =============================================================================
# Phase 0 — Gate 0 sanity spike.
#
# Task:        snapshot CURRENT-beam prediction, Scenario 31 only.
# Modalities:  GPS + camera only (cheapest encoders).
# Compare:     small SSM (Mamba) core vs matched causal Transformer core,
#              IDENTICAL encoders/fusion/head, core params matched within +/-10%.
# Budget:      <= 20 GPU-hours total (this spike runs in minutes on the 3070 Ti).
#
# GATE 0 (on val Top-1 gap = transformer_top1 - ssm_top1):
#   gap <= 3%           -> GREEN  (SSM parity; proceed to Phase 1)
#   3% < gap <= 8%      -> AMBER  (switch to hybrid: Mamba + periodic light attn)
#   gap > 8%            -> RED    (escalate to Pritam; do not proceed)
# =============================================================================

data_config: "configs/data.yaml"
scenario: 31
modalities: ["camera", "gps"]
seed: 1337

# Episode-level split WITHIN Scenario 31 (leakage-free; spike-local, not the
# frozen streaming manifest).
split:
  fracs: [0.70, 0.15, 0.15]   # train / val / test episodes

model:
  dim: 128
  core_layers: 4
  camera: {width: 32}
  gps: {in_dim: 3, hidden: 128}
  modality_dropout_p: 0.10
  param_parity_tol: 0.10
  # future_horizons: []       # off for the spike (current-beam only)
  ssm:
    d_state: 16
    d_conv: 4
    expand: 2
    dt_rank: 8
  transformer:
    nhead: 4
    dim_feedforward: 176      # tuned so core params match the SSM within +/-10%
    dropout: 0.0
    max_len: 128

train:
  epochs: 30
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.05
  warmup_epochs: 2
  grad_clip: 1.0
  label_smoothing: 0.05
  num_workers: 12             # feed the GPU (overrides loader.num_workers if set)

gate0:
  green_max_gap: 0.03
  amber_max_gap: 0.08

budget_gpu_hours: 20
results_dir: "experiments/phase0/results"
